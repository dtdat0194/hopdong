# Đưa trang web lên GitHub Pages mỗi khi nhánh main thay đổi.
# enablement: true để workflow tự bật Pages, khỏi phải vào Settings bấm tay.
name: Đưa lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nếu đang đẩy dở mà có lần đẩy mới thì để lần cũ chạy xong, không huỷ giữa chừng.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Trang chạy hoàn toàn ở phía trình duyệt nên không cần dựng gì,
      # chỉ việc đẩy nguyên thư mục lên.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
